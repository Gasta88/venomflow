global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'venomflow'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'venomflow-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'

  - job_name: 'dagster'
    static_configs:
      - targets: ['dagster-webserver:3000']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
