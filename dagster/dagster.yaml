# =============================================================================
# DAGSTER INSTANCE CONFIGURATION
# =============================================================================
# Defines storage, compute, and run coordination for Dagster

# Storage backend for run history, event logs, and schedules
storage:
  postgres:
    postgres_url:
      env: DAGSTER_POSTGRES_URL

# Run coordinator - determines how runs are executed
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator

# Run launcher - determines where runs execute
run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

# Compute logs storage
compute_logs:
  module: dagster.core.storage.compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /opt/dagster/dagster_home/compute_logs

# Local artifact storage
local_artifact_storage:
  module: dagster.core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /opt/dagster/dagster_home/storage

# Scheduler (optional - for scheduled runs)
scheduler:
  module: dagster.core.scheduler
  class: DagsterDaemonScheduler

# Sensor evaluation interval
sensor_evaluation:
  num_workers: 4
  num_submit_workers: 4

# Run monitoring
run_monitoring:
  enabled: true
  poll_interval_seconds: 120
  max_resume_run_attempts: 3

# Telemetry
telemetry:
  enabled: false
